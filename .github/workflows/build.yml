name: Build iwazePRO APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Wygeneruj projekt i zbuduj APK v8.2
        run: |
          mkdir -p app/src/main/java/pl/itaxiwaze/bridge
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "iwazePRO"
          include(":app")
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application' version '8.7.2'
          }
          android {
              namespace 'pl.itaxiwaze.bridge'
              compileSdk 35
              defaultConfig {
                  applicationId "pl.itaxiwaze.bridge"
                  minSdk 26
                  targetSdk 35
                  versionCode 43
                  versionName "8.2"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1EA1F2" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#E5A922" android:pathData="M54,23 C45,27 36,27 31,34 C35,44 33,64 54,82 C75,64 73,44 77,34 C72,27 63,27 54,23 Z"/>
              <path android:fillColor="#F9CA48" android:pathData="M54,26 C46,29 39,29 35,35 C38,44 36,62 54,78 C72,62 70,44 73,35 C69,29 62,29 54,26 Z"/>
              <path android:fillColor="#232F38" android:pathData="M54,22 L73,77 L54,66 Z"/>
              <path android:fillColor="#344450" android:pathData="M54,22 L54,66 L35,77 Z"/>
              <path android:fillColor="#F9CA48" android:pathData="M37,37 H71 V51 H37 Z"/>
              <path android:fillColor="#232F38" android:pathData="M38,39 H46 V41.5 H43.3 V49 H40.7 V41.5 H38 Z"/>
              <path android:fillColor="#232F38" android:pathData="M46.5,49 L50,39 H52.8 L56.3,49 H53.6 L52.9,46.8 H49.9 L49.2,49 Z M50.5,44.6 H52.3 L51.4,41.6 Z"/>
              <path android:fillColor="#232F38" android:pathData="M57,39 H59.8 L61.8,42.3 L63.8,39 H66.6 L63.3,43.9 L66.8,49 H64 L61.8,45.5 L59.6,49 H56.8 L60.3,43.9 Z"/>
              <path android:fillColor="#232F38" android:pathData="M67.8,39 H70.4 V49 H67.8 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
